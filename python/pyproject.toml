[project]
name = "dotfiles"
version = "0.1.0"
description = "Python packages for the shared $VENV_PYTHON_3 environment"
requires-python = ">=3.13"
dependencies = [
    "autopep8==2.3.2",
    "bcrypt==5.0.0",
    "beautifulsoup4==4.15.0",
    "boto3==1.43.125",
    "bpython==0.26",
    "html5lib==1.1",
    "music_tag==0.4.3",
    "ptpython==3.0.32",
    "requests==2.34.2",
    "telethon==1.45.0",
    "tesla_dashcam==0.1.21",
    "trafilatura==2.3.1; python_version >= '3.10'",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-sugar==1.1.1",
]
