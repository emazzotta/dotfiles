name: test

on:
  push:
    branches: [master]
    paths: ["bin/**"]
  pull_request:
    branches: [master]
    paths: ["bin/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest bin/tests/ -v
