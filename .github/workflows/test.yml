name: test

on:
  push:
    branches: [master]
    paths: ["bin/**", "python/**", ".github/workflows/test.yml"]
  pull_request:
    branches: [master]
    paths: ["bin/**", "python/**", ".github/workflows/test.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
      - run: uv sync --locked --project python
      - run: uv run --locked --project python python -m pytest bin/tests/ -v
